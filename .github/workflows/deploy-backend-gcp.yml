name: Deploy backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - '.dockerignore'
      - '.github/workflows/deploy-backend-gcp.yml'
      - 'eslint.config.mjs'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-gcp-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  IMAGE_NAME: backend-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION || vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY || vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || vars.CLOUD_RUN_SERVICE }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
      # gcloud reads this; avoids `gcloud config set project` (which can fail WIF impersonation refresh).
      CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub Variables / Secrets
        run: |
          set -euo pipefail
          MISSING=()
          [ -z "${GCP_PROJECT_ID:-}" ] && MISSING+=("GCP_PROJECT_ID")
          [ -z "${GCP_REGION:-}" ] && MISSING+=("GCP_REGION")
          [ -z "${GAR_REPOSITORY:-}" ] && MISSING+=("GAR_REPOSITORY")
          [ -z "${CLOUD_RUN_SERVICE:-}" ] && MISSING+=("CLOUD_RUN_SERVICE")
          [ -z "${GCP_WIF_PROVIDER:-}" ] && MISSING+=("GCP_WIF_PROVIDER")
          [ -z "${GCP_SERVICE_ACCOUNT:-}" ] && MISSING+=("GCP_SERVICE_ACCOUNT")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error title=Missing configuration::The following are not set (use Repository Variables or Secrets): ${MISSING[*]}"
            echo "Configure each under: Settings → Secrets and variables → Actions"
            exit 1
          fi
          case "${GCP_SERVICE_ACCOUNT}" in
            *@*.iam.gserviceaccount.com|*@developer.gserviceaccount.com) ;;
            *)
              echo "::error::GCP_SERVICE_ACCOUNT must be a service account email (e.g. deployer@PROJECT_ID.iam.gserviceaccount.com). Gaia id not found usually means this value is wrong or the account was deleted."
              exit 1
              ;;
          esac
          echo "All required deploy configuration values are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npx nx lint backend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      # Do not pass project_id here: that runs `gcloud config set project` and can trigger
      # "Gaia id not found for email" when the service account email is invalid or WIF binding is wrong.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        env:
          IMAGE_BASE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          docker build \
            -f apps/backend/Dockerfile \
            -t "${IMAGE_BASE}:${GITHUB_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .

      - name: Push Docker image
        env:
          IMAGE_BASE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE_BASE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_BASE}:${GITHUB_SHA}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --platform managed \
            --quiet \
            --update-env-vars "NODE_ENV=production"

          # Optional: add non-secret runtime env vars later, for example:
          # gcloud run services update "${CLOUD_RUN_SERVICE}" \
          #   --region "${GCP_REGION}" \
          #   --project "${GCP_PROJECT_ID}" \
          #   --update-env-vars "SWAGGER_ENABLED=false,TYPEORM_LOGGING=false,CORS_ORIGINS=https://your-frontend.example.com"

          # Optional: attach secrets from Secret Manager later, for example:
          # gcloud run services update "${CLOUD_RUN_SERVICE}" \
          #   --region "${GCP_REGION}" \
          #   --project "${GCP_PROJECT_ID}" \
          #   --update-secrets "DB_PASSWORD=DB_PASSWORD:latest,X_API_KEY=X_API_KEY:latest"
